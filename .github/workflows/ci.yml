name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm build:storybook
      - run: pnpm test:catalog

      # Release runs this before every publish; on pull requests only when the packed output can change.
      - name: Check whether the published packages changed
        id: pack
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" \
            | grep -qE '^(packages/|consumers/|scripts/published-consumer-smoke\.mjs|pnpm-lock\.yaml)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.pack.outputs.changed == 'true'
        run: pnpm test:pack

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit:deps
