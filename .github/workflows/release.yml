name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      # No registry-url: its .npmrc expects NODE_AUTH_TOKEN, which would stop npm
      # from using the OIDC token that trusted publishing relies on.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Trusted publishing needs npm 11.15 or later.
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm build:storybook
      - run: pnpm test:catalog
      - run: pnpm test:pack
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit:deps

      # Changesets only opens the "Version packages" PR; publishing is the next step.
      - name: Open or update the version PR
        id: changesets
        uses: changesets/action@v1
        with:
          title: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # While changesets are pending, the checkout holds the version PR's bumped
      # versions. Publish only once the version PR has merged and none remain.
      - name: Publish versions that are not on npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: node scripts/publish.mjs

      - name: Tag and release published versions
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: node scripts/tag-releases.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
