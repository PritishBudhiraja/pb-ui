name: Release

# Runs after CI passes on main, so lint, tests, builds and e2e are not repeated here.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      # No registry-url: its .npmrc expects NODE_AUTH_TOKEN, which would stop npm
      # from using the OIDC token that trusted publishing relies on.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Trusted publishing needs npm 11.15 or later.
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      # Changesets only opens the "Version packages" PR; publishing is the next step.
      - name: Open or update the version PR
        id: changesets
        uses: changesets/action@v1
        with:
          title: Version packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # While changesets are pending, the checkout holds the version PR's bumped
      # versions. Publish only once the version PR has merged and none remain.
      # Builds and packs the packages, then installs and builds them in Next and Vite apps.
      - name: Check the packed packages in consumer apps
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: pnpm test:pack

      - name: Publish versions that are not on npm
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: node scripts/publish.mjs

      - name: Tag and release published versions
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: node scripts/tag-releases.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
